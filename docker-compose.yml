# `make db`  -> infra only (postgres, mongo, rabbitmq, consul); run services with `make run`.
# `make up`  -> infra + gateway + all 5 services + web app in containers (profile "app").
#
# Service discovery (ADR-009): every service registers itself in Consul with a
# health check, and callers address services by name (consul://library,
# consul://user, ...). Only healthy instances are returned, so a replica that
# dies stops receiving traffic and `--scale <service>=N` needs no config change.
# Infrastructure (postgres, mongo, rabbitmq, consul) is single-instance and
# still reached by Docker DNS name.
#
# Only the web app (:3000) and the API Gateway (:8080) are published for
# application traffic (ADR-008); the services listen inside the Docker network only.

# Shared settings for the Go services. Every service gets the same env; each
# reads only what it needs.
x-app: &app
  build: ./backend
  profiles: ["app"]
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://seat:seat@postgres:5432/seatfinder
    MONGO_URL: mongodb://mongo:27017
    RABBITMQ_URL: amqp://seat:seat@rabbitmq:5672/
    CONSUL_ADDR: http://consul:8500
    USER_URL: consul://user
    OCCUPANCY_URL: consul://occupancy
    RESERVATION_URL: consul://reservation
    REVIEW_URL: consul://review
    LIBRARY_GRPC_ADDR: consul://library
    JWT_SECRET: ${JWT_SECRET:-dev-secret}
    POLL_INTERVAL: ${POLL_INTERVAL:-30}
  depends_on:
    postgres: { condition: service_healthy }
    mongo: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    consul: { condition: service_healthy }

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
      POSTGRES_DB: seatfinder
    ports:
      - "5432:5432"
    volumes:
      - seatfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seat", "-d", "seatfinder"]
      interval: 5s
      retries: 10

  # Review service store (ADR-006 amendment: reviews are document-shaped)
  mongo:
    image: mongo:8
    ports:
      - "27018:27017"   # host 27018: avoids clashing with a locally installed mongod
    volumes:
      - seatfinder-mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  # Message broker for async events between services (ADR-007).
  # Management UI: http://localhost:15672 (seat / seat)
  rabbitmq:
    image: rabbitmq:4-management
    # Fixed hostname: RabbitMQ keeps its data under the node name, so a new
    # container would otherwise start with empty queues.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: seat
      RABBITMQ_DEFAULT_PASS: seat
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - seatfinder-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  # Service registry (ADR-009). UI: http://localhost:8500 shows every instance
  # and its health. Dev mode keeps no state; services re-register every 30s.
  consul:
    image: hashicorp/consul:1.20
    command: ["agent", "-dev", "-client=0.0.0.0", "-log-level=warn"]
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      retries: 10

  # --- Go services (profile "app"). `restart` brings a crashed service back;
  # healthchecks report liveness in `docker compose ps` (99% uptime NFR, ADR-009).
  # No host ports except the gateway's, so any service can be scaled:
  #   docker compose --profile app up -d --scale library=3
  gateway:
    <<: *app
    command: ["/app/gateway"]
    ports: ["8080:8080"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"], interval: 10s }

  user:
    <<: *app
    command: ["/app/user"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"], interval: 10s }

  library:
    <<: *app
    command: ["/app/library"]
    # gRPC: a TCP check is enough for liveness; grpc.health.v1 is also served for grpcurl/k8s.
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "9082"], interval: 10s }

  occupancy:
    <<: *app
    command: ["/app/occupancy"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"], interval: 10s }

  reservation:
    <<: *app
    command: ["/app/reservation"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"], interval: 10s }

  review:
    <<: *app
    command: ["/app/review"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"], interval: 10s }

  # Next.js (ADR-001): serves pages and sends every /api/* call to the gateway.
  frontend:
    build:
      context: ./frontend
      args: { GATEWAY_URL: "http://gateway:8080" }
    image: seatfinder-frontend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    ports: ["3000:3000"]
    depends_on: [gateway]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"], interval: 10s }

volumes:
  seatfinder-pgdata:
  seatfinder-mongodata:
  seatfinder-rabbitmq:
